name: Publish JavaScript SDK (npm)

on:
  push:
    tags: ['javascript-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version to publish (must match packages/javascript/package.json)'
        required: true
      release_type:
        description: 'Release type'
        required: true
        default: stable
        type: choice
        options: [stable, prerelease]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Ensure npm trusted-publishing version
        run: npm install -g npm@11.5.1
      - name: Resolve and validate version
        id: ver
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then V="${GITHUB_REF_NAME#javascript-v}"; fi
          case "$V" in [0-9]*.[0-9]*.[0-9]*) ;; *) echo "Invalid semver: $V"; exit 1;; esac
          PKG="$(node -p "require('./packages/javascript/package.json').version")"
          [ "$V" = "$PKG" ] || { echo "Tag/input $V != package.json $PKG"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Build and test
        working-directory: packages/javascript
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
          npm pack --dry-run
      - name: Publish with npm provenance (OIDC)
        working-directory: packages/javascript
        run: npm publish --provenance --access public
      - name: Verify published version
        run: |
          for i in $(seq 1 12); do
            if [ "$(npm view @gridapi/sdk@${{ steps.ver.outputs.version }} version 2>/dev/null)" = "${{ steps.ver.outputs.version }}" ]; then
              echo "Verified on npm"; exit 0
            fi
            sleep 10
          done
          echo "Publication verification timed out"; exit 1
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: javascript-v${{ steps.ver.outputs.version }}
          name: JavaScript SDK v${{ steps.ver.outputs.version }}
          prerelease: ${{ inputs.release_type == 'prerelease' }}
          body: 'JavaScript SDK v${{ steps.ver.outputs.version }} published to npm as @gridapi/sdk.'
