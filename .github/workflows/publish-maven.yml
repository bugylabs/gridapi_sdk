name: Publish Java SDK (Maven Central)

on:
  push:
    tags: ['java-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version to publish (must match packages/java/pom.xml)'
        required: true
      release_type:
        description: 'Release type'
        required: true
        default: stable
        type: choice
        options: [stable, prerelease]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: maven-central-production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Resolve and validate version
        id: ver
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then V="${GITHUB_REF_NAME#java-v}"; fi
          case "$V" in [0-9]*.[0-9]*.[0-9]*) ;; *) echo "Invalid semver: $V"; exit 1;; esac
          PKG="$(python3 -c "import xml.etree.ElementTree as E;print(E.parse('packages/java/pom.xml').findtext('{http://maven.apache.org/POM/4.0.0}version'))")"
          [ "$V" = "$PKG" ] || { echo "Tag/input $V != pom.xml $PKG"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Test
        run: bash tests/contract/java/run.sh
      - name: Publish to Central Publisher Portal
        working-directory: packages/java
        run: mvn -B --no-transfer-progress deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      - name: Verify Maven Central availability
        run: |
          V="${{ steps.ver.outputs.version }}"
          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null "https://repo1.maven.org/maven2/io/gridapi/gridapi-sdk/$V/gridapi-sdk-$V.pom"; then
              echo "Verified on Maven Central"; exit 0
            fi
            sleep 15
          done
          echo "Maven Central verification timed out — check Central Publisher Portal"; exit 1
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: java-v${{ steps.ver.outputs.version }}
          name: Java SDK v${{ steps.ver.outputs.version }}
          prerelease: ${{ inputs.release_type == 'prerelease' }}
          body: 'Java SDK v${{ steps.ver.outputs.version }} published to Maven Central as io.gridapi:gridapi-sdk.'
