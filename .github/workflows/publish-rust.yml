name: Publish Rust SDK (crates.io)

on:
  push:
    tags: ['rust-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version to publish (must match Cargo.toml)'
        required: true
      release_type:
        description: 'Release type'
        required: true
        default: stable
        type: choice
        options: [stable, prerelease]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: cratesio-production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with: { components: rustfmt, clippy }
      - name: Resolve and validate version
        id: ver
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then V="${GITHUB_REF_NAME#rust-v}"; fi
          case "$V" in [0-9]*.[0-9]*.[0-9]*) ;; *) echo "Invalid semver: $V"; exit 1;; esac
          PKG="$(python3 -c "import tomllib;print(tomllib.load(open('packages/rust/Cargo.toml','rb'))['package']['version'])")"
          [ "$V" = "$PKG" ] || { echo "Tag/input $V != Cargo.toml $PKG"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Format, lint, test and package
        working-directory: packages/rust
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets
          cargo package --allow-dirty
          python3 -c "import tarfile,glob; t=tarfile.open(glob.glob('target/package/gridapi-sdk-*.crate')[0]); n=' '.join(t.getnames()); assert 'LICENSE' in n and 'Cargo.toml' in n; print('crate contents OK')"
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
        id: crate-auth
      - name: Publish to crates.io
        working-directory: packages/rust
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crate-auth.outputs.token }}
      - name: Verify published version
        run: |
          V="${{ steps.ver.outputs.version }}"
          for i in $(seq 1 12); do
            if cargo info gridapi-sdk@"$V" 2>/dev/null | grep -q "$V"; then
              echo "Verified on crates.io"; exit 0
            fi
            sleep 10
          done
          echo "Publication verification timed out"; exit 1
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: rust-v${{ steps.ver.outputs.version }}
          name: Rust SDK v${{ steps.ver.outputs.version }}
          prerelease: ${{ inputs.release_type == 'prerelease' }}
          body: 'Rust SDK v${{ steps.ver.outputs.version }} published to crates.io as gridapi-sdk.'
