name: publish-sdk

# Each SDK is released independently by its own tag, or by workflow_dispatch.
# Tags: javascript-v*, python-v*, java-v*, dotnet-v*, go-v*, rust-v*
on:
  push:
    tags:
      - "javascript-v*"
      - "python-v*"
      - "java-v*"
      - "dotnet-v*"
      - "go-v*"
      - "rust-v*"
  workflow_dispatch:
    inputs:
      sdk:
        description: SDK to publish
        required: true
        type: choice
        options: [javascript, python, java, dotnet, go, rust]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scripts/validate_contract.py

  javascript:
    needs: contract
    if: startsWith(github.ref, 'refs/tags/javascript-v') || (github.event_name == 'workflow_dispatch' && inputs.sdk == 'javascript')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm install
        working-directory: packages/javascript
      - run: npm run build
        working-directory: packages/javascript
      - run: npm test
        working-directory: packages/javascript
      - run: npm publish --provenance --access public
        working-directory: packages/javascript

  python:
    needs: contract
    if: startsWith(github.ref, 'refs/tags/python-v') || (github.event_name == 'workflow_dispatch' && inputs.sdk == 'python')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 -m unittest discover -s tests/contract/python -v
      - run: python3 -m pip install build
      - run: python3 -m build --outdir dist
        working-directory: packages/python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist

  java:
    needs: contract
    if: startsWith(github.ref, 'refs/tags/java-v') || (github.event_name == 'workflow_dispatch' && inputs.sdk == 'java')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - run: bash tests/contract/java/run.sh
      - run: mvn -B --no-transfer-progress deploy -DskipTests -f packages/java/pom.xml
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  dotnet:
    needs: contract
    if: startsWith(github.ref, 'refs/tags/dotnet-v') || (github.event_name == 'workflow_dispatch' && inputs.sdk == 'dotnet')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - run: bash tests/contract/dotnet/run.sh
      - run: dotnet pack -c Release -o out packages/dotnet/GridAPI/GridAPI.csproj
      - run: dotnet nuget push out/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

  go:
    needs: contract
    if: startsWith(github.ref, 'refs/tags/go-v') || (github.event_name == 'workflow_dispatch' && inputs.sdk == 'go')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: go test ./tests/contract/go -v
      # Go modules publish from the git tag itself; nothing to upload here.
      - run: git tag --points-at HEAD

  rust:
    needs: contract
    if: startsWith(github.ref, 'refs/tags/rust-v') || (github.event_name == 'workflow_dispatch' && inputs.sdk == 'rust')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path packages/rust/Cargo.toml
      - run: cargo publish --manifest-path packages/rust/Cargo.toml --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
