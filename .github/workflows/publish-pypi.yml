name: Publish Python SDK (PyPI)

on:
  push:
    tags: ['python-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version to publish (must match packages/python/pyproject.toml)'
        required: true
      release_type:
        description: 'Release type'
        required: true
        default: stable
        type: choice
        options: [stable, prerelease]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi-production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - name: Resolve and validate version
        id: ver
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then V="${GITHUB_REF_NAME#python-v}"; fi
          case "$V" in [0-9]*.[0-9]*.[0-9]*) ;; *) echo "Invalid semver: $V"; exit 1;; esac
          PKG="$(python3 -c "import tomllib;print(tomllib.load(open('packages/python/pyproject.toml','rb'))['project']['version'])")"
          [ "$V" = "$PKG" ] || { echo "Tag/input $V != pyproject.toml $PKG"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Test
        run: PYTHONPATH=packages/python python3 -m unittest discover -s tests/contract/python -v
      - name: Build and inspect distributions
        working-directory: packages/python
        run: |
          python3 -m pip install --upgrade build twine
          python3 -m build
          python3 -m twine check dist/*
          python3 -c "import zipfile,glob; z=zipfile.ZipFile(glob.glob('dist/*.whl')[0]); names=z.namelist(); assert 'LICENSE' in ' '.join(names), names; print('wheel contents OK')"
      - name: Verify wheel installs cleanly
        working-directory: packages/python
        run: |
          python3 -m venv /tmp/gridapi-pypi-verify
          /tmp/gridapi-pypi-verify/bin/pip install dist/*.whl
          /tmp/gridapi-pypi-verify/bin/python -c "from gridapi import GridApiClient; print('clean install OK')"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: packages/python/dist/
      - name: Verify published version
        run: |
          for i in $(seq 1 12); do
            if python3 -m pip index versions gridapi-sdk 2>/dev/null | grep -q "${{ steps.ver.outputs.version }}"; then
              echo "Verified on PyPI"; exit 0
            fi
            sleep 10
          done
          echo "Publication verification timed out"; exit 1
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: python-v${{ steps.ver.outputs.version }}
          name: Python SDK v${{ steps.ver.outputs.version }}
          prerelease: ${{ inputs.release_type == 'prerelease' }}
          body: 'Python SDK v${{ steps.ver.outputs.version }} published to PyPI as gridapi-sdk.'
